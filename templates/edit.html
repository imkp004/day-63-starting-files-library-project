<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rating</title>
</head>
<body>
    <h4>Book Name: {{ book.title }}</h4>
    <h4>Book Author: {{ book.author }}</h4>
    <h4>Current Rating: {{ book.rating }}</h4>
    <form action="{{ url_for('edit_rating') }}" method="POST" novalidate>

        {{ form.hidden_tag() }}
        {{ form.id() }}  <!-- hidden field -->
      <p> Update Rating <br> {{ form.rating(size=30) }}
          {% for err in form.rating.errors %}
          <span style="color:red">{{err}}</span>
          {% endfor %}
      </p>

      <p>{{form.submit(label="Edit Rating")}}</p>

    </form>
    <a href="{{ url_for('home') }}">Return to Home Page</a>
  </body>
</html>
